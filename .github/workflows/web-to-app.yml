name: Web To App
on:
  workflow_dispatch:
    inputs:
      server:
        description: Logical build slot
        required: true
        type: choice
        options: ["1","2","3","4","5"]
      website_url:
        description: Public website URL
        required: true
        type: string
      app_name:
        description: Android application display name
        required: true
        type: string
      build_mode:
        description: Build mode
        required: true
        type: choice
        options: ["release","debug"]
      project_path:
        description: WebView wrapper Android project path in repository
        required: true
        default: "templates/webview-android"
      user_id:
        required: false
        type: string
      username:
        required: false
        type: string
      user_name:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: webapp-${{ inputs.server }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Configure WebView wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ inputs.project_path }}/gradlew"
          python3 - <<'PY'
          import os, re
          url = os.environ["SITE_URL"]
          name = os.environ["APP_NAME"]
          if not re.match(r'^https?://', url): raise SystemExit("URL must start with http:// or https://")
          if len(name) > 40: raise SystemExit("App name must be 40 characters or less")
          p = os.path.join(os.environ["PROJECT_PATH"], "app/src/main/res/values/strings.xml")
          if os.path.exists(p):
            text = open(p, encoding="utf-8").read()
            text = re.sub(r'(<string name="app_name">).*?(</string>)', lambda m: m.group(1)+name.replace("&","&amp;").replace("<","&lt;")+m.group(2), text)
            open(p,"w",encoding="utf-8").write(text)
          java = os.path.join(os.environ["PROJECT_PATH"], "app/src/main/java/com/example/webapp/MainActivity.kt")
          if os.path.exists(java):
            text = open(java, encoding="utf-8").read().replace("https://example.com", url)
            open(java,"w",encoding="utf-8").write(text)
          PY
        env:
          SITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PROJECT_PATH: ${{ inputs.project_path }}
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.project_path }}"
          if [ "${{ inputs.build_mode }}" = "release" ]; then ./gradlew assembleRelease --stacktrace; else ./gradlew assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webapp-${{ inputs.build_mode }}-server-${{ inputs.server }}
          path: |
            ${{ inputs.project_path }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
