name: Flutter Build
on:
  workflow_dispatch:
    inputs:
      server:
        description: Logical build slot
        required: true
        type: choice
        options: ["1","2","3","4","5"]
      project_path:
        description: Optional path to Flutter project in repository (leave . for auto-detect)
        required: true
        default: "."
      build_mode:
        description: Build mode
        required: true
        type: choice
        options: ["release","debug"]
      user_id:
        required: false
        type: string
      username:
        required: false
        type: string
      user_name:
        required: false
        type: string
      base_zip_path:
        description: Path to uploaded Flutter base ZIP in this repository
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-${{ inputs.server }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare uploaded Flutter base ZIP
        if: ${{ inputs.base_zip_path != '' }}
        shell: bash
        env:
          BASE_ZIP_PATH: ${{ inputs.base_zip_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$BASE_ZIP_PATH" ]; then
            echo "Uploaded base ZIP not found: $BASE_ZIP_PATH"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/flutter-base"
          unzip -q "$BASE_ZIP_PATH" -d "$RUNNER_TEMP/flutter-base"
          # Use uploaded ZIP as the project source. The workflow's detection step
          # searches this folder recursively for pubspec.yaml/pubspec.yml.
          echo "Uploaded Flutter base extracted to $RUNNER_TEMP/flutter-base"
          echo "FLUTTER_INPUT_DIR=$RUNNER_TEMP/flutter-base" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Detect Flutter project and normalize pubspec filename
        shell: bash
        env:
          REQUESTED_PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          requested="${FLUTTER_INPUT_DIR:-${REQUESTED_PROJECT_PATH:-.}}"
          if [ ! -d "$requested" ]; then
            echo "Project path does not exist: $requested"
            exit 1
          fi
          cd "$requested"
          if [ ! -f pubspec.yaml ] && [ ! -f pubspec.yml ]; then
            found="$(find . -type f \( -name pubspec.yaml -o -name pubspec.yml \)               -not -path './.git/*' -not -path './build/*' -not -path './.dart_tool/*'               -print -quit)"
            if [ -z "$found" ]; then
              echo "No pubspec.yaml or pubspec.yml found under $requested"
              echo "Top-level files:"; ls -la
              exit 1
            fi
            project_dir="$(dirname "$found")"
            cd "$project_dir"
          fi
          if [ -f pubspec.yml ] && [ ! -f pubspec.yaml ]; then
            cp pubspec.yml pubspec.yaml
            echo "Detected pubspec.yml; copied it to pubspec.yaml for Flutter compatibility."
          fi
          if [ ! -f pubspec.yaml ]; then
            echo "pubspec.yaml could not be prepared."
            exit 1
          fi
          resolved="$PWD"
          echo "FLUTTER_PROJECT_DIR=$resolved" >> "$GITHUB_ENV"
          echo "Flutter project directory: $resolved"
          ls -la
          flutter --version
          flutter pub get
      - name: Upgrade Gradle Wrapper for current Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLUTTER_PROJECT_DIR"
          wrapper="android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$wrapper" ]; then
            echo "Gradle wrapper properties not found: $wrapper"
            exit 1
          fi
          # Flutter stable 3.47.x requires Gradle 8.14.0 or newer.
          # Pin to 8.14.3 rather than bypassing Flutter's dependency validation.
          if grep -q '^distributionUrl=' "$wrapper"; then
            sed -i -E 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' "$wrapper"
          else
            echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip' >> "$wrapper"
          fi
          echo "Updated Gradle Wrapper to 8.14.3"
          grep '^distributionUrl=' "$wrapper"
      - name: Upgrade Android Gradle Plugin for current Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLUTTER_PROJECT_DIR"
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          # Update common AGP declarations used by Flutter Android projects.
          candidates = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]
          found = False
          changed = []
          patterns = [
              # Plugins DSL: id("com.android.application") version "8.7.3"
              (re.compile(r'(id\s*\(?\s*[\'\"]com\.android\.(?:application|library)[\'\"]\s*\)?\s*version\s*[\'\"])([^\'\"]+)([\'\"])'), 1),
              # Legacy buildscript classpath: com.android.tools.build:gradle:8.7.3
              (re.compile(r'(com\.android\.tools\.build:gradle:)([0-9][^\'\"\s]*)'), 2),
          ]
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text()
              original = text
              for pattern, _ in patterns:
                  text = pattern.sub(lambda m: m.group(1) + "8.11.1" + (m.group(3) if m.lastindex and m.lastindex >= 3 else ""), text)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
                  found = True
          # Also support common version-catalog declaration: agp = "8.7.3".
          catalog = Path("android/gradle/libs.versions.toml")
          if catalog.is_file():
              text = catalog.read_text()
              updated = re.sub(r'(?m)^(\s*agp\s*=\s*[\'\"])[^\'\"]+([\'\"])', r'\g<1>8.11.1\g<2>', text)
              if updated != text:
                  catalog.write_text(updated)
                  changed.append(str(catalog))
                  found = True
          if changed:
              print("Updated Android Gradle Plugin declaration(s) to 8.11.1:")
              print("\n".join(changed))
          else:
              # Some projects use custom variables/aliases. Do not silently claim success.
              print("No common AGP version declaration found; showing Android Gradle config for diagnosis:")
              for path in candidates + [catalog]:
                  if path.is_file():
                      print(f"--- {path} ---")
                      print(path.read_text()[:12000])
              raise SystemExit("Could not safely locate the AGP version declaration. Update the project's AGP version to 8.11.1 in its Android Gradle configuration.")
          PYCODE
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLUTTER_PROJECT_DIR"
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-${{ inputs.build_mode }}-server-${{ inputs.server }}
          path: ${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7
