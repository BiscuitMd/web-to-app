name: Flutter Build
on:
  workflow_dispatch:
    inputs:
      server:
        description: Logical build slot
        required: true
        type: choice
        options: ["1","2","3","4","5"]
      project_path:
        description: Path to Flutter project in repository
        required: true
        default: "."
      build_mode:
        description: Build mode
        required: true
        type: choice
        options: ["release","debug"]
      user_id:
        required: false
        type: string
      username:
        required: false
        type: string
      user_name:
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-${{ inputs.server }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve project and pubspec
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.project_path }}"
          test -f pubspec.yaml || { echo "pubspec.yaml not found"; exit 1; }
          flutter --version
          flutter pub get
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.project_path }}"
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-${{ inputs.build_mode }}-server-${{ inputs.server }}
          path: |
            ${{ inputs.project_path }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7
