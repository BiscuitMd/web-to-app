name: Flutter Build
on:
  workflow_dispatch:
    inputs:
      server:
        description: Logical build slot
        required: true
        type: choice
        options: ["1","2","3","4","5"]
      project_path:
        description: Optional path to Flutter project in repository (leave . for auto-detect)
        required: true
        default: "."
      build_mode:
        description: Build mode
        required: true
        type: choice
        options: ["release","debug"]
      user_id:
        required: false
        type: string
      username:
        required: false
        type: string
      user_name:
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-${{ inputs.server }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Detect Flutter project and normalize pubspec filename
        shell: bash
        env:
          REQUESTED_PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_PROJECT_PATH:-.}"
          if [ ! -d "$requested" ]; then
            echo "Project path does not exist: $requested"
            exit 1
          fi
          cd "$requested"
          if [ ! -f pubspec.yaml ] && [ ! -f pubspec.yml ]; then
            found="$(find . -type f \( -name pubspec.yaml -o -name pubspec.yml \)               -not -path './.git/*' -not -path './build/*' -not -path './.dart_tool/*'               -print -quit)"
            if [ -z "$found" ]; then
              echo "No pubspec.yaml or pubspec.yml found under $requested"
              echo "Top-level files:"; ls -la
              exit 1
            fi
            project_dir="$(dirname "$found")"
            cd "$project_dir"
          fi
          if [ -f pubspec.yml ] && [ ! -f pubspec.yaml ]; then
            cp pubspec.yml pubspec.yaml
            echo "Detected pubspec.yml; copied it to pubspec.yaml for Flutter compatibility."
          fi
          if [ ! -f pubspec.yaml ]; then
            echo "pubspec.yaml could not be prepared."
            exit 1
          fi
          resolved="$PWD"
          echo "FLUTTER_PROJECT_DIR=$resolved" >> "$GITHUB_ENV"
          echo "Flutter project directory: $resolved"
          ls -la
          flutter --version
          flutter pub get
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLUTTER_PROJECT_DIR"
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-${{ inputs.build_mode }}-server-${{ inputs.server }}
          path: ${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7
