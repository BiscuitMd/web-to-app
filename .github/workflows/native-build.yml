name: Native Build

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target directory (folder tempat ZIP)'
        required: false
        default: '.'
        type: string

      # Compatibility inputs used by the Telegram bot script
      server:
        description: 'Metadata server dari bot (opsional)'
        required: false
        type: string

      build_mode:
        description: 'Mode build dari bot (opsional)'
        required: false
        type: string

      project_path:
        description: 'Path project atau ZIP dari bot (opsional)'
        required: false
        type: string

      user_id:
        description: 'Telegram user ID (metadata)'
        required: false
        type: string

      username:
        description: 'Telegram username (metadata)'
        required: false
        type: string

      user_name:
        description: 'Nama user Telegram (metadata)'
        required: false
        type: string

      zip_file:
        description: 'Nama file ZIP project'
        required: false
        default: 'project.zip'
        type: string

      build_task:
        description: 'Gradle task'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease
          - bundleDebug

      build_flavor:
        description: 'Product flavor (kosongkan kalau tidak ada)'
        required: false
        default: ''
        type: string

      java_version:
        description: 'Versi Java'
        required: false
        default: '17'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VALIDATE INPUT + FIND ZIP
      # ============================================================
      - name: Validate Target Directory
        id: validate
        shell: bash
        env:
          INPUT_TARGET_DIR: ${{ github.event.inputs.target_dir }}
          INPUT_ZIP_FILE: ${{ github.event.inputs.zip_file }}
          INPUT_PROJECT_PATH: ${{ github.event.inputs.project_path }}
        run: |
          set -Eeuo pipefail

          echo "::group::Validate Project Input"

          TARGET="${INPUT_TARGET_DIR:-.}"
          ZIP="${INPUT_ZIP_FILE:-project.zip}"
          PROJECT_PATH="${INPUT_PROJECT_PATH:-}"

          [ -n "$TARGET" ] || TARGET="."

          # Explicit project_path pointing to a ZIP.
          if [ -n "$PROJECT_PATH" ] &&
             [ -f "$PROJECT_PATH" ] &&
             [[ "$PROJECT_PATH" == *.zip ]]; then

            TARGET="$(dirname "$PROJECT_PATH")"
            ZIP="$(basename "$PROJECT_PATH")"

          # Package a supplied Gradle project directory temporarily.
          elif [ -n "$PROJECT_PATH" ] &&
               [ -d "$PROJECT_PATH" ] &&
               [ "$PROJECT_PATH" != "." ] &&
               {
                 [ -f "$PROJECT_PATH/settings.gradle" ] ||
                 [ -f "$PROJECT_PATH/settings.gradle.kts" ] ||
                 [ -f "$PROJECT_PATH/gradlew" ] ||
                 [ -f "$PROJECT_PATH/build.gradle" ] ||
                 [ -f "$PROJECT_PATH/build.gradle.kts" ];
               }; then

            mkdir -p "$RUNNER_TEMP/native-input"

            (
              cd "$PROJECT_PATH"
              zip -qr "$RUNNER_TEMP/native-input/project-input.zip" . \
                -x '.git/*' \
                   '*/.git/*' \
                   'build/*' \
                   '*/build/*' \
                   '.gradle/*' \
                   '*/.gradle/*'
            )

            TARGET="$RUNNER_TEMP/native-input"
            ZIP="project-input.zip"

          # A project_path ZIP may not exist at the specified location.
          elif [ -n "$PROJECT_PATH" ] && [[ "$PROJECT_PATH" == *.zip ]]; then
            PROJECT_DIR="$(dirname "$PROJECT_PATH")"
            PROJECT_NAME="$(basename "$PROJECT_PATH")"

            if [ -f "$PROJECT_PATH" ]; then
              TARGET="$PROJECT_DIR"
              ZIP="$PROJECT_NAME"
            else
              echo "::notice::ZIP path from project_path does not exist; searching repository inputs."
            fi
          fi

          # Do not treat a non-Gradle directory as the project root.
          if [ -n "$PROJECT_PATH" ] &&
             [ -d "$PROJECT_PATH" ] &&
             [ "$PROJECT_PATH" != "." ] &&
             [ "$TARGET" = "${INPUT_TARGET_DIR:-.}" ]; then

            if [ -f "$PROJECT_PATH/settings.gradle" ] ||
               [ -f "$PROJECT_PATH/settings.gradle.kts" ] ||
               [ -f "$PROJECT_PATH/gradlew" ] ||
               [ -f "$PROJECT_PATH/build.gradle" ] ||
               [ -f "$PROJECT_PATH/build.gradle.kts" ]; then
              :
            else
              echo "::notice::project_path is not a Gradle root; ZIP discovery will continue."
            fi
          fi

          ZIP_PATH=""

          # First honor the exact requested path.
          if [ -f "$TARGET/$ZIP" ]; then
            ZIP_PATH="$TARGET/$ZIP"
          elif [ -f "$ZIP" ]; then
            ZIP_PATH="$ZIP"
            TARGET="$(dirname "$ZIP_PATH")"
            [ -n "$TARGET" ] || TARGET="."
          fi

          # Search common upload locations.
          if [ -z "$ZIP_PATH" ]; then
            SEARCH_DIRS=()

            [ -d "$TARGET" ] && SEARCH_DIRS+=("$TARGET")
            [ -d "build-inputs" ] && SEARCH_DIRS+=("build-inputs")
            [ -d "build-inputs/flutter" ] && SEARCH_DIRS+=("build-inputs/flutter")

            for SEARCH_DIR in "${SEARCH_DIRS[@]}"; do
              if [ -f "$SEARCH_DIR/$ZIP" ]; then
                ZIP_PATH="$SEARCH_DIR/$ZIP"
                break
              fi
            done
          fi

          # If the default name was not found, select the newest ZIP
          # under build-inputs, including nested folders.
          if [ -z "$ZIP_PATH" ] &&
             { [ "$ZIP" = "project.zip" ] || [ -z "$ZIP" ]; }; then

            if [ -d "build-inputs" ]; then
              ZIP_PATH="$(
                find "build-inputs" -type f -iname '*.zip' \
                  -not -path '*/.git/*' \
                  -printf '%T@ %p\n' 2>/dev/null |
                sort -nr |
                head -n 1 |
                cut -d' ' -f2-
              )"
            fi

            if [ -n "$ZIP_PATH" ]; then
              ZIP="$(basename "$ZIP_PATH")"
              TARGET="$(dirname "$ZIP_PATH")"
            fi
          fi

          # Search recursively for an explicitly named ZIP.
          if [ -z "$ZIP_PATH" ] && [ -d "build-inputs" ]; then
            FOUND_EXACT="$(
              find "build-inputs" -type f -name "$ZIP" \
                -not -path '*/.git/*' \
                -print -quit 2>/dev/null || true
            )"

            if [ -n "$FOUND_EXACT" ]; then
              ZIP_PATH="$FOUND_EXACT"
              TARGET="$(dirname "$ZIP_PATH")"
            fi
          fi

          # Final fallback: newest ZIP in build-inputs.
          if [ -z "$ZIP_PATH" ] && [ -d "build-inputs" ]; then
            ZIP_PATH="$(
              find "build-inputs" -type f -iname '*.zip' \
                -not -path '*/.git/*' \
                -printf '%T@ %p\n' 2>/dev/null |
              sort -nr |
              head -n 1 |
              cut -d' ' -f2-
            )"

            if [ -n "$ZIP_PATH" ]; then
              ZIP="$(basename "$ZIP_PATH")"
              TARGET="$(dirname "$ZIP_PATH")"
            fi
          fi

          # Use the generated temporary ZIP when applicable.
          if [ -z "$ZIP_PATH" ] &&
             [ -f "$RUNNER_TEMP/native-input/project-input.zip" ]; then
            ZIP_PATH="$RUNNER_TEMP/native-input/project-input.zip"
            TARGET="$RUNNER_TEMP/native-input"
            ZIP="project-input.zip"
          fi

          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::File ZIP project tidak ditemukan."
            echo "::error::Nama ZIP yang diminta: $ZIP"
            echo "::error::Target awal: $INPUT_TARGET_DIR"
            echo "::error::project_path: $PROJECT_PATH"
            echo ""
            echo "Repository root:"
            ls -la .
            echo ""
            echo "Isi build-inputs (jika ada):"

            if [ -d "build-inputs" ]; then
              find "build-inputs" -maxdepth 5 -type f -print | head -n 200
            else
              echo "Folder build-inputs tidak ditemukan."
            fi

            exit 1
          fi

          ZIP_PATH="$(realpath "$ZIP_PATH")"
          TARGET="$(dirname "$ZIP_PATH")"
          ZIP="$(basename "$ZIP_PATH")"

          if [ ! -d "$TARGET" ]; then
            echo "::error::Target directory tidak ditemukan: $TARGET"
            exit 1
          fi

          ZIP_BYTES="$(stat -c%s "$ZIP_PATH")"
          ZIP_MB=$((ZIP_BYTES / 1024 / 1024))
          ZIP_KB=$((ZIP_BYTES / 1024))

          echo "ZIP ditemukan: $ZIP_PATH"
          echo "Ukuran ZIP: ${ZIP_MB} MB (${ZIP_KB} KB / ${ZIP_BYTES} bytes)"

          if ! unzip -t "$ZIP_PATH" >/dev/null 2>&1; then
            echo "::error::ZIP tidak valid atau rusak: $ZIP_PATH"
            unzip -t "$ZIP_PATH" || true
            exit 1
          fi

          echo "ZIP integrity check OK"
          echo "Disk space sebelum extract:"
          df -h | head -n 2

          AVAILABLE_MB="$(df -m "$TARGET" | tail -n 1 | awk '{print $4}')"
          echo "Available space: ${AVAILABLE_MB} MB"

          if [ "$AVAILABLE_MB" -lt 5000 ]; then
            echo "::warning::Disk space kurang dari 5GB; build project besar bisa gagal."
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_size_mb=$ZIP_MB" >> "$GITHUB_OUTPUT"

          echo "Validation berhasil."
          echo "::endgroup::"

      # ============================================================
      # EXTRACT PROJECT
      # ============================================================
      - name: Extract Project Zip
        id: extract
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Extract Project"

          ZIP_PATH="${{ steps.validate.outputs.zip_path }}"
          EXTRACT_DIR="$RUNNER_TEMP/native-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting: $ZIP_PATH"
          START_TIME="$(date +%s)"

          unzip -o "$ZIP_PATH" -d "$EXTRACT_DIR"

          END_TIME="$(date +%s)"
          DURATION=$((END_TIME - START_TIME))

          echo "Extract selesai dalam ${DURATION}s"
          echo "Extracted size: $(du -sh "$EXTRACT_DIR" | awk '{print $1}')"

          df -h | head -n 2

          echo "::group::Extracted Files"
          ls -la "$EXTRACT_DIR"
          echo "::endgroup::"

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # ============================================================
      # DETECT GRADLE PROJECT ROOT
      # ============================================================
      - name: Detect Gradle Project Root
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Detect Project Root"

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"
          ROOT=""

          if [ -f "$EXTRACT_DIR/settings.gradle" ] ||
             [ -f "$EXTRACT_DIR/settings.gradle.kts" ] ||
             [ -f "$EXTRACT_DIR/build.gradle" ] ||
             [ -f "$EXTRACT_DIR/build.gradle.kts" ] ||
             [ -f "$EXTRACT_DIR/gradlew" ]; then

            ROOT="$EXTRACT_DIR"
          else
            FOUND="$(
              find "$EXTRACT_DIR" -maxdepth 5 -type f \
                \( -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "gradlew" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \) \
                -not -path "*/node_modules/*" \
                -not -path "*/build/*" \
                -print -quit
            )"

            if [ -z "$FOUND" ]; then
              echo "::error::Project Gradle tidak ditemukan di dalam ZIP."
              find "$EXTRACT_DIR" -maxdepth 4 -type f | head -n 100
              exit 1
            fi

            ROOT="$(dirname "$FOUND")"

            CURRENT="$ROOT"
            while [ "$CURRENT" != "$EXTRACT_DIR" ] && [ "$CURRENT" != "/" ]; do
              if [ -f "$CURRENT/settings.gradle" ] ||
                 [ -f "$CURRENT/settings.gradle.kts" ]; then
                ROOT="$CURRENT"
                break
              fi
              CURRENT="$(dirname "$CURRENT")"
            done
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

          echo "::group::Project Structure"
          ls -la "$ROOT" | head -n 50
          echo "::endgroup::"
          echo "::endgroup::"

      # ============================================================
      # DETECT FLUTTER PROJECT ROOT
      # ============================================================
      - name: Detect Flutter Project Root
        id: flutter_detect
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"
          GRADLE_ROOT="${{ steps.detect.outputs.root }}"
          FLUTTER_ROOT=""

          # A Flutter Android project normally has pubspec.yaml above
          # its android/ directory.
          CURRENT="$GRADLE_ROOT"

          while [ "$CURRENT" != "/" ]; do
            if [ -f "$CURRENT/pubspec.yaml" ]; then
              FLUTTER_ROOT="$CURRENT"
              break
            fi

            CURRENT="$(dirname "$CURRENT")"
          done

          # Fallback for ZIPs containing nested Flutter projects.
          if [ -z "$FLUTTER_ROOT" ]; then
            FOUND="$(
              find "$EXTRACT_DIR" -maxdepth 7 \
                -type f -name "pubspec.yaml" \
                -not -path "*/.gradle/*" \
                -not -path "*/build/*" \
                -not -path "*/node_modules/*" \
                -print -quit
            )"

            if [ -n "$FOUND" ]; then
              FLUTTER_ROOT="$(dirname "$FOUND")"
            fi
          fi

          if [ -n "$FLUTTER_ROOT" ]; then
            echo "is_flutter=true" >> "$GITHUB_OUTPUT"
            echo "flutter_root=$FLUTTER_ROOT" >> "$GITHUB_OUTPUT"
            echo "Flutter project ditemukan: $FLUTTER_ROOT"
          else
            echo "is_flutter=false" >> "$GITHUB_OUTPUT"
            echo "flutter_root=" >> "$GITHUB_OUTPUT"
            echo "Project Flutter tidak ditemukan; lanjut sebagai Gradle biasa."
          fi

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java_version || '17' }}

      # ============================================================
      # GRADLE CACHE
      # ============================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Setup Android SDK"

          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -fLsS \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o android-commandline-tools.zip

          mkdir -p "$RUNNER_TEMP/android-cmdline-tools"

          unzip -q android-commandline-tools.zip \
            -d "$RUNNER_TEMP/android-cmdline-tools"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          rm -rf "$RUNNER_TEMP/android-cmdline-tools"
          rm -f android-commandline-tools.zip

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK setup OK"
          echo "::endgroup::"

      - name: Accept Licenses & Install SDK Packages
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Install SDK Packages"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "platforms;android-32" \
            "build-tools;32.0.0"

          echo "SDK packages installed"
          echo "::endgroup::"

      # ============================================================
      # FLUTTER SDK — ONLY FOR FLUTTER PROJECTS
      # ============================================================
      - name: Setup Flutter
        if: steps.flutter_detect.outputs.is_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        if: steps.flutter_detect.outputs.is_flutter == 'true'
        working-directory: ${{ steps.flutter_detect.outputs.flutter_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Flutter Dependencies"
          flutter --version
          flutter pub get
          echo "::endgroup::"

      # ============================================================
      # GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2'

      # ============================================================
      # AUTO-GENERATE MISSING ICONS
      # ============================================================
      - name: Auto-Generate Missing Icons
        id: gen_icons
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Auto-Generate Missing Icons"

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          MANIFEST="$(
            find . -name "AndroidManifest.xml" \
              -path "*/main/*" -type f -print -quit
          )"

          if [ -z "$MANIFEST" ]; then
            echo "::warning::AndroidManifest.xml tidak ditemukan; skip icon generation."
            echo "::endgroup::"
            exit 0
          fi

          echo "Manifest: $MANIFEST"
          RES_DIR="$(dirname "$MANIFEST")/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "::warning::Folder res/ tidak ditemukan; skip icon generation."
            echo "::endgroup::"
            exit 0
          fi

          ICONS="$(
            grep -oE '@mipmap/[a-zA-Z0-9_]+' "$MANIFEST" |
            sed 's|@mipmap/||' |
            sort -u || true
          )"

          if [ -z "$ICONS" ]; then
            echo "::warning::Tidak ada referensi @mipmap/ di manifest."
            echo "::endgroup::"
            exit 0
          fi

          for icon in $ICONS; do
            for density_size in \
              "mdpi:48" \
              "hdpi:72" \
              "xhdpi:96" \
              "xxhdpi:144" \
              "xxxhdpi:192"; do

              density="${density_size%%:*}"
              size="${density_size##*:}"

              target_dir="$RES_DIR/mipmap-$density"
              target_file="$target_dir/$icon.png"

              [ -f "$target_file" ] && continue

              mkdir -p "$target_dir"

              INITIAL="$(printf '%s' "$icon" | cut -c1 | tr '[:lower:]' '[:upper:]')"

              case "$icon" in
                *instagram*) COLOR="#E1306C" ;;
                *youtube*) COLOR="#FF0000" ;;
                *whatsapp*) COLOR="#25D366" ;;
                *telegram*) COLOR="#0088CC" ;;
                *nxxx*) COLOR="#FF6B9D" ;;
                *round*) COLOR="#4A90E2" ;;
                *launcher*) COLOR="#10B981" ;;
                *) COLOR="#3B82F6" ;;
              esac

              convert -size "${size}x${size}" "xc:$COLOR" \
                -gravity center \
                -pointsize "$((size / 2))" \
                -fill white \
                -font DejaVu-Sans-Bold \
                -annotate +0+0 "$INITIAL" \
                "$target_file" 2>/dev/null || {
                  echo "::warning::Gagal membuat icon otomatis: $target_file"
                }

              echo "Icon diperiksa: $target_file"
            done
          done

          echo "::endgroup::"

      # ============================================================
      # PREPARE GRADLE WRAPPER
      # ============================================================
      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Prepare Gradle Wrapper"

          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] ||
             [ ! -f "gradlew" ]; then
            echo "Gradle wrapper belum lengkap; membuat wrapper Gradle 8.2."
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi

          chmod +x gradlew
          echo "Gradle wrapper siap."
          echo "::endgroup::"

      # ============================================================
      # LOCAL PROPERTIES — FIX FLUTTER.SDK
      # ============================================================
      - name: Fix local.properties
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        env:
          IS_FLUTTER: ${{ steps.flutter_detect.outputs.is_flutter }}
          FLUTTER_PROJECT_ROOT: ${{ steps.flutter_detect.outputs.flutter_root }}
        run: |
          set -Eeuo pipefail

          echo "::group::Fix local.properties"

          PROPERTIES_FILE="local.properties"
          TEMP_FILE="$(mktemp)"

          # Preserve other existing properties.
          if [ -f "$PROPERTIES_FILE" ]; then
            grep -vE '^(sdk\.dir|flutter\.sdk)=' \
              "$PROPERTIES_FILE" > "$TEMP_FILE" || true
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> "$TEMP_FILE"

          if [ "$IS_FLUTTER" = "true" ]; then
            if ! command -v flutter >/dev/null 2>&1; then
              echo "::error::Flutter SDK belum tersedia."
              rm -f "$TEMP_FILE"
              exit 1
            fi

            FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
            FLUTTER_SDK_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"

            if [ ! -d "$FLUTTER_SDK_ROOT/packages/flutter_tools" ]; then
              echo "::error::Lokasi Flutter SDK tidak valid: $FLUTTER_SDK_ROOT"
              rm -f "$TEMP_FILE"
              exit 1
            fi

            printf 'flutter.sdk=%s\n' "$FLUTTER_SDK_ROOT" >> "$TEMP_FILE"
            echo "Flutter project root: $FLUTTER_PROJECT_ROOT"
            echo "Flutter SDK root: $FLUTTER_SDK_ROOT"
          fi

          mv "$TEMP_FILE" "$PROPERTIES_FILE"

          echo "Isi local.properties:"
          cat "$PROPERTIES_FILE"

          echo "::endgroup::"

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build with Gradle
        id: gradle_build
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -uo pipefail

          echo "::group::Gradle Build"

          TASK="${{ github.event.inputs.build_task }}"
          MODE="${{ github.event.inputs.build_mode }}"
          FLAVOR="${{ github.event.inputs.build_flavor }}"

          # Preserve compatibility with Telegram bot build_mode values.
          case "$(printf '%s' "$MODE" | tr '[:upper:]' '[:lower:]')" in
            debug|assembledebug|apk-debug)
              TASK="assembleDebug"
              ;;
            release|assemblerelease|apk|apk-release)
              TASK="assembleRelease"
              ;;
            bundle|bundlerelease|aab)
              TASK="bundleRelease"
              ;;
            bundledebug)
              TASK="bundleDebug"
              ;;
          esac

          [ -n "$TASK" ] || TASK="assembleRelease"

          case "$TASK" in
            assembleRelease|assembleDebug|bundleRelease|bundleDebug)
              ;;
            *)
              echo "::error::Gradle task tidak diizinkan: $TASK"
              exit 1
              ;;
          esac

          if [ -n "$FLAVOR" ]; then
            CAP_FLAVOR="$(printf '%s' "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            FINAL_TASK="${TASK}${CAP_FLAVOR}"
          else
            FINAL_TASK="$TASK"
          fi

          echo "Running: ./gradlew $FINAL_TASK"

          set +e
          set -o pipefail
          ./gradlew "$FINAL_TASK" --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "Exit code: $EXIT_CODE"
          echo "::endgroup::"

          exit "$EXIT_CODE"

      # ============================================================
      # GRADLE FAILURE LOG
      # ============================================================
      - name: Show Gradle Error (Kalau Gagal)
        if: failure()
        shell: bash
        run: |
          echo "::group::Gradle Error (Last 100 lines)"

          if [ -f /tmp/gradle.log ]; then
            tail -n 100 /tmp/gradle.log
          else
            echo "File /tmp/gradle.log belum tersedia."
          fi

          echo "::endgroup::"

      # ============================================================
      # LOCATE APK/AAB
      # ============================================================
      - name: Locate APK/AAB (RECURSIVE SEARCH)
        id: locate
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="${{ steps.detect.outputs.root }}"

          echo "Searching in: $ROOT"

          echo "::group::Folder Tree"
          find "$ROOT" -maxdepth 3 -type d \
            -not -path "*/.*" | head -n 50
          echo "::endgroup::"

          echo "::group::Searching for APK"
          APKS="$(
            find "$ROOT" -type f -name "*.apk" \
              -not -path "*/.gradle/*" \
              -not -path "*/.git/*" 2>/dev/null || true
          )"

          if [ -n "$APKS" ]; then
            echo "APK ditemukan:"
            echo "$APKS"
          else
            echo "Tidak ada APK."
          fi
          echo "::endgroup::"

          echo "::group::Searching for AAB"
          AABS="$(
            find "$ROOT" -type f -name "*.aab" \
              -not -path "*/.gradle/*" \
              -not -path "*/.git/*" 2>/dev/null || true
          )"

          if [ -n "$AABS" ]; then
            echo "AAB ditemukan:"
            echo "$AABS"
          else
            echo "Tidak ada AAB."
          fi
          echo "::endgroup::"

          if [ -z "$APKS" ] && [ -z "$AABS" ]; then
            echo "::error::Tidak ada APK/AAB yang dihasilkan."

            echo "::group::Debug build folders"
            find "$ROOT" -type d -name "build" 2>/dev/null | head -n 30
            echo "::endgroup::"

            echo "::group::Debug outputs folders"
            find "$ROOT" -type d -name "outputs" 2>/dev/null | head -n 30
            echo "::endgroup::"

            echo "::group::Debug APK/AAB files"
            find "$ROOT" -type f \
              \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null
            echo "::endgroup::"

            exit 1
          fi

          {
            echo "apks<<EOF"
            echo "$APKS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "aabs<<EOF"
            echo "$AABS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Locate APK/AAB selesai."

      # ============================================================
      # BUILD INFO
      # ============================================================
      - name: Generate Build Info
        if: always()
        shell: bash
        run: |
          {
            echo "=== NATIVE BUILD INFO ==="
            echo "Job ID: ${{ github.run_id }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Target Dir: ${{ github.event.inputs.target_dir }}"
            echo "Project Path: ${{ github.event.inputs.project_path }}"
            echo "Server: ${{ github.event.inputs.server }}"
            echo "User ID: ${{ github.event.inputs.user_id }}"
            echo "Username: ${{ github.event.inputs.username }}"
            echo "User Name: ${{ github.event.inputs.user_name }}"
            echo "Requested Zip: ${{ github.event.inputs.zip_file }}"
            echo "Resolved Zip: ${{ steps.validate.outputs.zip }}"
            echo "Zip Size: ${{ steps.validate.outputs.zip_size_mb }} MB"
            echo "Build Mode: ${{ github.event.inputs.build_mode }}"
            echo "Build Task: ${{ github.event.inputs.build_task }}"
            echo "Build Flavor: ${{ github.event.inputs.build_flavor }}"
            echo "Java Version: ${{ github.event.inputs.java_version }}"
            echo "Project Root: ${{ steps.detect.outputs.root }}"
            echo "Flutter Project: ${{ steps.flutter_detect.outputs.is_flutter }}"
            echo "Flutter Root: ${{ steps.flutter_detect.outputs.flutter_root }}"
            echo "Commit: ${{ github.sha }}"
            echo "Actor: ${{ github.actor }}"
            echo "Finished: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > BUILD_INFO.txt

          cat BUILD_INFO.txt

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success() && steps.locate.outputs.apks != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ steps.locate.outputs.apks }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD APP BUNDLE
      # ============================================================
      - name: Upload App Bundle
        if: success() && steps.locate.outputs.aabs != ''
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: ${{ steps.locate.outputs.aabs }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD BUILD INFO
      # ============================================================
      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # UPLOAD GRADLE LOG
      # ============================================================
      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # SUMMARY
      # ============================================================
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Native Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Job ID | ${{ github.run_id }} |"
            echo "| Requested ZIP | ${{ github.event.inputs.zip_file }} |"
            echo "| Resolved ZIP | ${{ steps.validate.outputs.zip }} |"
            echo "| ZIP Size | ${{ steps.validate.outputs.zip_size_mb }} MB |"
            echo "| Build Mode | ${{ github.event.inputs.build_mode }} |"
            echo "| Build Task | ${{ github.event.inputs.build_task }} |"
            echo "| Flavor | ${{ github.event.inputs.build_flavor }} |"
            echo "| Java | ${{ github.event.inputs.java_version }} |"
            echo "| Flutter Project | ${{ steps.flutter_detect.outputs.is_flutter }} |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"