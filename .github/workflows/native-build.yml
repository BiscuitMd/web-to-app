
name: Native Android Build

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Build server"
        required: false
        default: "github"
        type: string
      build_mode:
        description: "Build mode: auto, flutter, or gradle"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - flutter
          - gradle
      project_path:
        description: "Project directory after extraction"
        required: false
        default: "."
        type: string
      target_dir:
        description: "Directory containing project ZIP files"
        required: false
        default: "build-inputs/flutter"
        type: string
      zip_file:
        description: "ZIP filename (blank = auto detect)"
        required: false
        default: ""
        type: string
      build_task:
        description: "Gradle task"
        required: false
        default: "assembleDebug"
        type: string
      build_flavor:
        description: "Flutter flavor (optional)"
        required: false
        default: ""
        type: string
      java_version:
        description: "Java version"
        required: false
        default: "17"
        type: string
      user_id:
        description: "Telegram user ID"
        required: false
        default: ""
        type: string
      username:
        description: "Telegram username"
        required: false
        default: ""
        type: string
      user_name:
        description: "Telegram display name"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}-${{ github.event.inputs.user_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Accept licenses BEFORE installing Android SDK packages.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --licenses </dev/null >/dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare project
        id: project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          TARGET_DIR: ${{ inputs.target_dir }}
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/android-project"
          WORK_DIR="$RUNNER_TEMP/android-project"

          if [ -n "$ZIP_FILE" ]; then
            ZIP_PATH="$ZIP_FILE"
            if [ ! -f "$ZIP_PATH" ]; then
              ZIP_PATH="$TARGET_DIR/$ZIP_FILE"
            fi
            if [ ! -f "$ZIP_PATH" ]; then
              echo "::error::ZIP file not found: $ZIP_FILE"
              exit 1
            fi
          else
            ZIP_PATH=""
            if [ -d "$TARGET_DIR" ]; then
              ZIP_PATH="$(find "$TARGET_DIR" -maxdepth 1 -type f -iname '*.zip' | sort | head -n 1 || true)"
            fi
          fi

          if [ -n "$ZIP_PATH" ]; then
            echo "Extracting: $ZIP_PATH"
            unzip -q "$ZIP_PATH" -d "$WORK_DIR"
          else
            echo "No ZIP selected; using checked-out repository."
            cp -a "$GITHUB_WORKSPACE/." "$WORK_DIR/"
          fi

          if [ "$PROJECT_PATH" != "." ] && [ -n "$PROJECT_PATH" ]; then
            if [ -d "$WORK_DIR/$PROJECT_PATH" ]; then
              WORK_DIR="$WORK_DIR/$PROJECT_PATH"
            elif [ -d "$GITHUB_WORKSPACE/$PROJECT_PATH" ]; then
              WORK_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH"
            else
              echo "::error::Project directory not found: $PROJECT_PATH"
              find "$RUNNER_TEMP/android-project" -maxdepth 3 -type f \
                \( -name pubspec.yaml -o -name settings.gradle -o -name settings.gradle.kts \) \
                -print
              exit 1
            fi
          else
            # Detect a nested project when the ZIP contains a wrapper folder.
            if [ ! -f "$WORK_DIR/pubspec.yaml" ] \
              && [ ! -f "$WORK_DIR/settings.gradle" ] \
              && [ ! -f "$WORK_DIR/settings.gradle.kts" ] \
              && [ ! -f "$WORK_DIR/gradlew" ]; then
              CANDIDATE="$(find "$WORK_DIR" -mindepth 2 -maxdepth 5 \
                \( -name pubspec.yaml -o -name settings.gradle -o -name settings.gradle.kts -o -name gradlew \) \
                -type f -print -quit || true)"
              if [ -n "$CANDIDATE" ]; then
                WORK_DIR="$(dirname "$CANDIDATE")"
                # If candidate is pubspec.yaml or gradlew, its directory is the project root.
                if [ "$(basename "$CANDIDATE")" = "settings.gradle" ] \
                  || [ "$(basename "$CANDIDATE")" = "settings.gradle.kts" ]; then
                  WORK_DIR="$(dirname "$CANDIDATE")"
                fi
              fi
            fi
          fi

          echo "project_dir=$WORK_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $WORK_DIR"
          ls -la "$WORK_DIR"

      - name: Detect build system
        id: detect
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          MODE="$BUILD_MODE"

          if [ "$MODE" = "auto" ]; then
            if [ -f pubspec.yaml ]; then
              MODE="flutter"
            elif [ -f gradlew ] \
              || [ -f settings.gradle ] \
              || [ -f settings.gradle.kts ] \
              || [ -f build.gradle ] \
              || [ -f build.gradle.kts ]; then
              MODE="gradle"
            else
              echo "::error::Could not detect Flutter or Gradle project."
              echo "Project files:"
              find . -maxdepth 3 -type f | head -n 100
              exit 1
            fi
          fi

          if [ "$MODE" = "flutter" ] && [ ! -f pubspec.yaml ]; then
            echo "::error::Flutter mode selected, but pubspec.yaml was not found."
            exit 1
          fi

          if [ "$MODE" = "gradle" ] \
            && [ ! -f gradlew ] \
            && [ ! -f settings.gradle ] \
            && [ ! -f settings.gradle.kts ] \
            && [ ! -f build.gradle ] \
            && [ ! -f build.gradle.kts ]; then
            echo "::error::Gradle mode selected, but Gradle files were not found."
            exit 1
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected build mode: $MODE"

      - name: Set up Flutter
        if: steps.detect.outputs.mode == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: steps.detect.outputs.mode == 'flutter'
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

          if [ -n "$BUILD_FLAVOR" ]; then
            flutter build apk --release --flavor "$BUILD_FLAVOR"
          else
            flutter build apk --release
          fi

      - name: Build Android Gradle project
        if: steps.detect.outputs.mode == 'gradle'
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          BUILD_TASK: ${{ inputs.build_task }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon "$BUILD_TASK"
          else
            echo "::error::gradlew is missing. The project must include its Gradle wrapper."
            exit 1
          fi

      - name: Collect build outputs
        id: outputs
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find "$PROJECT_DIR" -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -not -path '*/.gradle/*' \
            -not -path '*/.dart_tool/*' \
            -exec cp -f {} "$GITHUB_WORKSPACE/build-output/" \;

          if ! find "$GITHUB_WORKSPACE/build-output" -type f \
            \( -name '*.apk' -o -name '*.aab' \) | grep -q .; then
            echo "::error::Build finished but no APK or AAB was found."
            exit 1
          fi

          echo "Build artifacts:"
          ls -lh "$GITHUB_WORKSPACE/build-output"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.run_number }}
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
