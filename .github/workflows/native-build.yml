
name: Native Build

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Build server"
        required: false
        type: string
        default: "github"
      build_mode:
        description: "Build mode"
        required: false
        type: string
        default: "debug"
      project_path:
        description: "Project directory or ZIP path"
        required: true
        type: string
      user_id:
        description: "Telegram user ID"
        required: false
        type: string
        default: ""
      username:
        description: "Telegram username"
        required: false
        type: string
        default: ""
      user_name:
        description: "Telegram display name"
        required: false
        type: string
        default: ""
      target_dir:
        description: "Optional project directory override"
        required: false
        type: string
        default: "."
      zip_file:
        description: "Optional ZIP filename"
        required: false
        type: string
        default: "project.zip"
      build_task:
        description: "Optional Gradle task override"
        required: false
        type: string
        default: ""
      build_flavor:
        description: "Optional Android flavor"
        required: false
        type: string
        default: ""
      java_version:
        description: "Java version"
        required: false
        type: string
        default: "17"

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Android Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve project path
        id: project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          TARGET_DIR: ${{ inputs.target_dir }}
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -euo pipefail

          PROJECT="$PROJECT_PATH"

          if [ -z "$PROJECT" ]; then
            PROJECT="$TARGET_DIR"
          fi

          if [ -f "$PROJECT" ] && [[ "$PROJECT" == *.zip ]]; then
            mkdir -p "$RUNNER_TEMP/native-project"
            unzip -q "$PROJECT" -d "$RUNNER_TEMP/native-project"
            PROJECT="$RUNNER_TEMP/native-project"
          elif [ ! -e "$PROJECT" ] && [ -f "$ZIP_FILE" ]; then
            mkdir -p "$RUNNER_TEMP/native-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/native-project"
            PROJECT="$RUNNER_TEMP/native-project"
          fi

          if [ ! -d "$PROJECT" ]; then
            echo "::error::Project directory not found: $PROJECT"
            echo "Provide a valid project directory or an existing ZIP path."
            exit 1
          fi

          GRADLE_ROOT="$(find "$PROJECT" -type f \( \
            -name gradlew -o -name build.gradle -o -name build.gradle.kts \
          \) -print -quit | xargs -r dirname)"

          if [ -z "$GRADLE_ROOT" ]; then
            echo "::error::No Gradle project found in $PROJECT"
            exit 1
          fi

          echo "path=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $GRADLE_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Gradle project
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ ! -f local.properties ]; then
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          elif [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle wrapper properties exist but gradlew is missing."
            exit 1
          elif command -v gradle >/dev/null 2>&1; then
            gradle wrapper
            chmod +x gradlew
          else
            echo "::error::No Gradle wrapper or installed Gradle found."
            exit 1
          fi

      - name: Select Gradle task
        id: task
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_TASK: ${{ inputs.build_task }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
        run: |
          set -euo pipefail

          if [ -n "$BUILD_TASK" ]; then
            TASK="$BUILD_TASK"
          else
            MODE="$(echo "$BUILD_MODE" | tr '[:upper:]' '[:lower:]')"

            case "$MODE" in
              debug|assembledebug)
                TASK="assembleDebug"
                ;;
              release|assemblerelease)
                TASK="assembleRelease"
                ;;
              bundle|bundlerelease|aab)
                TASK="bundleRelease"
                ;;
              bundledebug)
                TASK="bundleDebug"
                ;;
              *)
                echo "::error::Unsupported build_mode: $BUILD_MODE"
                echo "Use debug, release, bundle, or bundleDebug."
                exit 1
                ;;
            esac
          fi

          if [[ -n "$BUILD_FLAVOR" ]]; then
            TASK="assemble${BUILD_FLAVOR^}${TASK#assemble}"
          fi

          echo "value=$TASK" >> "$GITHUB_OUTPUT"
          echo "Selected Gradle task: $TASK"

      - name: Run native build
        id: build
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.path }}
          GRADLE_TASK: ${{ steps.task.outputs.value }}
        run: |
          set -uo pipefail
          cd "$PROJECT_ROOT"

          set +e
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace "$GRADLE_TASK" \
              2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
            RESULT=${PIPESTATUS[0]}
          else
            echo "::error::Gradle wrapper is not executable."
            RESULT=1
          fi
          set -e

          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"
          exit "$RESULT"

      - name: Collect build outputs
        if: always()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-artifacts"

          if [ -d "$PROJECT_ROOT" ]; then
            find "$PROJECT_ROOT" -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -path '*/build/outputs/*' \
              -exec cp --parents '{}' "$RUNNER_TEMP/native-artifacts/" \; \
              2>/dev/null || true
          fi

          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            cp "$RUNNER_TEMP/gradle-build.log" \
              "$RUNNER_TEMP/native-artifacts/gradle-build.log"
          fi

          {
            echo "Build mode: ${{ inputs.build_mode }}"
            echo "Build task: ${{ steps.task.outputs.value }}"
            echo "Project: ${{ inputs.project_path }}"
            echo "Server: ${{ inputs.server }}"
            echo "Telegram user ID: ${{ inputs.user_id }}"
            echo "Telegram username: ${{ inputs.username }}"
            echo "Telegram name: ${{ inputs.user_name }}"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/native-artifacts/build-info.txt"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ github.run_number }}
          path: ${{ runner.temp }}/native-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outputs.exit_code }}
          BUILD_TASK: ${{ steps.task.outputs.value }}
        run: |
          {
            echo "## Native Build Summary"
            echo ""
            echo "- **Repository:** $GITHUB_REPOSITORY"
            echo "- **Run:** $GITHUB_RUN_NUMBER"
            echo "- **Task:** ${BUILD_TASK:-not selected}"
            echo "- **Exit code:** ${BUILD_RESULT:-not available}"
            echo "- **Artifacts:** native-build-$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"
