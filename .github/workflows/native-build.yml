name: Native Kotlin Build
on:
  workflow_dispatch:
    inputs:
      server:
        description: Logical build slot
        required: true
        type: choice
        options: ["1","2","3","4","5"]
      project_path:
        description: Android Gradle project path
        required: true
        default: "."
      build_mode:
        description: Build mode
        required: true
        type: choice
        options: ["release","debug"]
      user_id:
        required: false
        type: string
      username:
        required: false
        type: string
      user_name:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: native-${{ inputs.server }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Validate Gradle project
        run: |
          test -f "${{ inputs.project_path }}/gradlew"
          chmod +x "${{ inputs.project_path }}/gradlew"
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.project_path }}"
          if [ "${{ inputs.build_mode }}" = "release" ]; then ./gradlew assembleRelease --stacktrace; else ./gradlew assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ inputs.build_mode }}-server-${{ inputs.server }}
          path: |
            ${{ inputs.project_path }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
