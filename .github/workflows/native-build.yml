name: Native Build

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Build server"
        required: false
        type: string
        default: "github"

      build_mode:
        description: "Build mode: release, debug, atau bundle"
        required: false
        type: string
        default: "release"

      project_path:
        description: "Path folder project atau ZIP"
        required: false
        type: string
        default: "."

      target_dir:
        description: "Folder target project"
        required: false
        type: string
        default: "."

      zip_file:
        description: "Nama ZIP project jika diperlukan"
        required: false
        type: string
        default: "project.zip"

      build_task:
        description: "Gradle task opsional, contoh assembleRelease"
        required: false
        type: string
        default: ""

      build_flavor:
        description: "Flutter/Android flavor opsional"
        required: false
        type: string
        default: ""

      java_version:
        description: "Java version"
        required: false
        type: string
        default: "17"

      user_id:
        description: "Telegram user ID"
        required: false
        type: string
        default: ""

      username:
        description: "Telegram username"
        required: false
        type: string
        default: ""

      user_name:
        description: "Telegram display name"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Detect and build project
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Resolve and extract project
        id: project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          TARGET_DIR: ${{ inputs.target_dir }}
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -Eeuo pipefail

          WORK_DIR="$RUNNER_TEMP/native-project"
          EXTRACT_DIR="$RUNNER_TEMP/native-extracted"

          rm -rf "$WORK_DIR" "$EXTRACT_DIR"
          mkdir -p "$WORK_DIR" "$EXTRACT_DIR"

          PROJECT_INPUT="${PROJECT_PATH:-.}"
          TARGET_INPUT="${TARGET_DIR:-.}"
          ZIP_INPUT="${ZIP_FILE:-project.zip}"
          SOURCE=""

          # Pilih sumber project.
          if [[ -f "$PROJECT_INPUT" && "$PROJECT_INPUT" == *.zip ]]; then
            SOURCE="$PROJECT_INPUT"

          elif [[ -f "$TARGET_INPUT" && "$TARGET_INPUT" == *.zip ]]; then
            SOURCE="$TARGET_INPUT"

          elif [[ "$PROJECT_INPUT" != "." && -d "$PROJECT_INPUT" ]]; then
            SOURCE=""

          elif [[ "$TARGET_INPUT" != "." && -d "$TARGET_INPUT" ]]; then
            SOURCE=""

          elif [[ -f "$ZIP_INPUT" ]]; then
            SOURCE="$ZIP_INPUT"

          elif [[ -f "build-inputs/flutter/$ZIP_INPUT" ]]; then
            SOURCE="build-inputs/flutter/$ZIP_INPUT"

          else
            # Fallback: ZIP terbaru dari folder input Flutter.
            SOURCE="$(find build-inputs/flutter -maxdepth 1 -type f \
              -iname '*.zip' -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
          fi

          if [[ -n "$SOURCE" ]]; then
            if [[ ! -f "$SOURCE" ]]; then
              echo "::error::ZIP project tidak ditemukan: $SOURCE"
              exit 1
            fi

            echo "Menggunakan ZIP: $SOURCE"
            unzip -q "$SOURCE" -d "$EXTRACT_DIR"

            # Cari root Flutter terlebih dahulu.
            FLUTTER_ROOT="$(find "$EXTRACT_DIR" -type f \
              -name pubspec.yaml -not -path '*/.dart_tool/*' \
              -print -quit | xargs -r dirname)"

            if [[ -n "$FLUTTER_ROOT" ]]; then
              PROJECT_ROOT="$FLUTTER_ROOT"
              PROJECT_TYPE="flutter"
            else
              # Cari root Gradle Android.
              GRADLE_FILE="$(find "$EXTRACT_DIR" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \
                   -o -name gradlew \) \
                -not -path '*/.gradle/*' -print -quit || true)"

              if [[ -n "$GRADLE_FILE" ]]; then
                PROJECT_ROOT="$(dirname "$GRADLE_FILE")"
              else
                BUILD_FILE="$(find "$EXTRACT_DIR" -type f \
                  \( -name build.gradle -o -name build.gradle.kts \) \
                  -not -path '*/.gradle/*' -print -quit || true)"

                if [[ -z "$BUILD_FILE" ]]; then
                  echo "::error::ZIP tidak berisi pubspec.yaml atau file Gradle Android."
                  echo "Periksa struktur ZIP project yang diunggah."
                  exit 1
                fi

                PROJECT_ROOT="$(dirname "$BUILD_FILE")"
              fi

              PROJECT_TYPE="gradle"
            fi

          else
            # Gunakan folder project yang dipilih.
            if [[ "$PROJECT_INPUT" != "." && -d "$PROJECT_INPUT" ]]; then
              PROJECT_ROOT="$PROJECT_INPUT"
            elif [[ "$TARGET_INPUT" != "." && -d "$TARGET_INPUT" ]]; then
              PROJECT_ROOT="$TARGET_INPUT"
            else
              PROJECT_ROOT="$GITHUB_WORKSPACE"
            fi

            if [[ -f "$PROJECT_ROOT/pubspec.yaml" ]]; then
              PROJECT_TYPE="flutter"
            elif [[ -f "$PROJECT_ROOT/settings.gradle" \
                 || -f "$PROJECT_ROOT/settings.gradle.kts" \
                 || -f "$PROJECT_ROOT/gradlew" \
                 || -f "$PROJECT_ROOT/build.gradle" \
                 || -f "$PROJECT_ROOT/build.gradle.kts" ]]; then
              PROJECT_TYPE="gradle"
            else
              echo "::error::Project Android/Flutter tidak ditemukan."
              echo "project_path: $PROJECT_INPUT"
              echo "target_dir: $TARGET_INPUT"
              echo "ZIP fallback dicari di build-inputs/flutter/*.zip"
              echo "Isi root repository:"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi
          fi

          if [[ ! -d "$PROJECT_ROOT" ]]; then
            echo "::error::Folder project tidak valid: $PROJECT_ROOT"
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "Project type: $PROJECT_TYPE"
          echo "Isi folder:"
          ls -la "$PROJECT_ROOT"

          echo "path=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "type=$PROJECT_TYPE" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.project.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter project
        if: steps.project.outputs.type == 'flutter'
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
        run: |
          set -Eeuo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml tidak ditemukan di root Flutter."
            exit 1
          fi

          flutter --version
          flutter pub get

          MODE="$(echo "${BUILD_MODE:-release}" | tr '[:upper:]' '[:lower:]')"
          FLAVOR_ARGS=()

          if [[ -n "${BUILD_FLAVOR:-}" ]]; then
            FLAVOR_ARGS=(--flavor "$BUILD_FLAVOR")
          fi

          case "$MODE" in
            debug)
              flutter build apk --debug "${FLAVOR_ARGS[@]}"
              ;;
            bundle|appbundle|aab)
              flutter build appbundle --release "${FLAVOR_ARGS[@]}"
              ;;
            release|apk|"")
              flutter build apk --release "${FLAVOR_ARGS[@]}"
              ;;
            *)
              echo "::error::build_mode tidak didukung: $MODE"
              echo "Gunakan release, debug, atau bundle."
              exit 1
              ;;
          esac

      - name: Build Android Gradle project
        if: steps.project.outputs.type == 'gradle'
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_TASK: ${{ inputs.build_task }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
        run: |
          set -Eeuo pipefail

          if [[ ! -f gradlew ]]; then
            echo "::error::gradlew tidak ditemukan di root project."
            echo "Project native harus menyertakan Gradle Wrapper."
            exit 1
          fi

          chmod +x gradlew

          if [[ -n "${BUILD_TASK:-}" ]]; then
            TASK="$BUILD_TASK"
          else
            MODE="$(echo "${BUILD_MODE:-release}" | tr '[:upper:]' '[:lower:]')"

            case "$MODE" in
              debug)
                TASK="assembleDebug"
                ;;
              bundle|appbundle|aab)
                TASK="bundleRelease"
                ;;
              release|"")
                TASK="assembleRelease"
                ;;
              *)
                echo "::error::build_mode tidak didukung: $MODE"
                exit 1
                ;;
            esac

            if [[ -n "${BUILD_FLAVOR:-}" ]]; then
              FLAVOR="$(printf '%s' "$BUILD_FLAVOR" \
                | sed -E 's/(^|-)([a-z])/\U\2/g' \
                | sed 's/-//g')"

              case "$MODE" in
                debug) TASK="assemble${FLAVOR}Debug" ;;
                bundle|appbundle|aab) TASK="bundle${FLAVOR}Release" ;;
                *) TASK="assemble${FLAVOR}Release" ;;
              esac
            fi
          fi

          echo "Menjalankan Gradle task: $TASK"
          ./gradlew --no-daemon "$TASK"

      - name: Collect build artifacts
        id: artifacts
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.path }}
        run: |
          set -Eeuo pipefail

          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACT_DIR"

          COUNT=0

          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            DEST="$ARTIFACT_DIR/$NAME"

            # Hindari menimpa file jika nama artifact sama.
            if [[ -e "$DEST" ]]; then
              EXT="${NAME##*.}"
              BASE="${NAME%.*}"
              DEST="$ARTIFACT_DIR/${BASE}-${COUNT}.${EXT}"
            fi

            cp "$FILE" "$DEST"
            echo "Artifact ditemukan: $DEST"
            COUNT=$((COUNT + 1))
          done < <(
            find "$PROJECT_ROOT" -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -not -path '*/.gradle/*' -print0
          )

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::Build selesai tetapi file APK/AAB tidak ditemukan."
            exit 1
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          SERVER: ${{ inputs.server }}
          USER_ID: ${{ inputs.user_id }}
          USERNAME: ${{ inputs.username }}
          USER_NAME: ${{ inputs.user_name }}
          PROJECT_TYPE: ${{ steps.project.outputs.type }}
          PROJECT_PATH: ${{ steps.project.outputs.path }}
          ARTIFACT_COUNT: ${{ steps.artifacts.outputs.count }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Native Build Summary"
            echo ""
            echo "- Status: **$JOB_STATUS**"
            echo "- Server: \`${SERVER:-github}\`"
            echo "- Build mode: \`${BUILD_MODE:-release}\`"
            echo "- Project type: \`${PROJECT_TYPE:-unknown}\`"
            echo "- Project path: \`${PROJECT_PATH:-unknown}\`"
            echo "- Artifacts: \`${ARTIFACT_COUNT:-0}\`"
            echo "- Telegram user ID: \`${USER_ID:-not provided}\`"
            echo "- Telegram username: \`${USERNAME:-not provided}\`"
            echo "- Telegram name: \`${USER_NAME:-not provided}\`"
            echo ""
            echo "APK/AAB tersedia di tab **Actions → workflow run → Artifacts** jika build berhasil."
          } >> "$GITHUB_STEP_SUMMARY"