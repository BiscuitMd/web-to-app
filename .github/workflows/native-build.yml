
name: Native Build

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Build server"
        required: false
        type: string
        default: "github"
      build_mode:
        description: "Build mode: debug, release, bundle"
        required: false
        type: string
        default: "release"
      project_path:
        description: "Android project folder or ZIP path"
        required: false
        type: string
        default: "."
      user_id:
        description: "Telegram user ID"
        required: false
        type: string
        default: ""
      username:
        description: "Telegram username"
        required: false
        type: string
        default: ""
      user_name:
        description: "Telegram display name"
        required: false
        type: string
        default: ""
      target_dir:
        description: "Fallback project directory"
        required: false
        type: string
        default: "."
      zip_file:
        description: "Project ZIP filename"
        required: false
        type: string
        default: "project.zip"
      build_task:
        description: "Gradle task override"
        required: false
        type: string
        default: ""
      build_flavor:
        description: "Optional Android product flavor"
        required: false
        type: string
        default: ""
      java_version:
        description: "Java version"
        required: false
        type: string
        default: "17"

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve and extract Android project
        id: project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          TARGET_DIR: ${{ inputs.target_dir }}
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -Eeuo pipefail

          WORK="$RUNNER_TEMP/native-project"
          mkdir -p "$WORK"

          PROJECT="${PROJECT_PATH:-}"
          [ -n "$PROJECT" ] || PROJECT="${TARGET_DIR:-.}"

          # Resolve relative paths from the checked-out repository.
          if [[ "$PROJECT" != /* ]]; then
            PROJECT="$GITHUB_WORKSPACE/$PROJECT"
          fi

          ZIP_PATH=""

          # A direct ZIP path was provided.
          if [ -f "$PROJECT" ] && [[ "$PROJECT" == *.zip ]]; then
            ZIP_PATH="$PROJECT"

          # A project directory was provided.
          elif [ -d "$PROJECT" ]; then
            # Prefer a Gradle project already inside the directory.
            GRADLE_FILE="$(find "$PROJECT" \
              -type f \
              \( -name settings.gradle -o \
                 -name settings.gradle.kts -o \
                 -name build.gradle -o \
                 -name build.gradle.kts -o \
                 -name gradlew \) \
              -not -path '*/.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/build/*' \
              -print -quit || true)"

            if [ -n "$GRADLE_FILE" ]; then
              echo "Gradle project files found in directory."
            else
              # No Gradle files: look for the configured ZIP.
              if [ -f "$PROJECT/$ZIP_FILE" ]; then
                ZIP_PATH="$PROJECT/$ZIP_FILE"
              elif [ -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
                ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_FILE"
              else
                # Only auto-select a ZIP if exactly one candidate exists.
                mapfile -t ZIPS < <(
                  find "$PROJECT" -maxdepth 2 -type f -name '*.zip' \
                    -not -path '*/.git/*' | sort
                )

                if [ "${#ZIPS[@]}" -eq 1 ]; then
                  ZIP_PATH="${ZIPS[0]}"
                elif [ "${#ZIPS[@]}" -gt 1 ]; then
                  echo "::error::Multiple ZIP files found. Set project_path or zip_file explicitly."
                  printf '%s\n' "${ZIPS[@]}"
                  exit 1
                fi
              fi
            fi
          else
            # A missing path may still refer to a ZIP in the repository.
            if [ -f "$GITHUB_WORKSPACE/$PROJECT_PATH" ] &&
               [[ "$PROJECT_PATH" == *.zip ]]; then
              ZIP_PATH="$GITHUB_WORKSPACE/$PROJECT_PATH"
            elif [ -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
              ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_FILE"
            else
              echo "::error::Project path does not exist: $PROJECT"
              exit 1
            fi
          fi

          if [ -n "$ZIP_PATH" ]; then
            echo "ZIP selected: $ZIP_PATH"

            if ! unzip -t "$ZIP_PATH" >/dev/null 2>&1; then
              echo "::error::ZIP is invalid or corrupted: $ZIP_PATH"
              exit 1
            fi

            unzip -oq "$ZIP_PATH" -d "$WORK"
            PROJECT="$WORK"
          fi

          # Locate a Gradle root. Prefer settings.gradle(.kts).
          ROOT=""

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            ROOT="$(dirname "$FILE")"
            break
          done < <(
            find "$PROJECT" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/build/*' \
              -not -path '*/.gradle/*' | sort
          )

          # Fall back to build files or the Gradle wrapper.
          if [ -z "$ROOT" ]; then
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              ROOT="$(dirname "$FILE")"
              break
            done < <(
              find "$PROJECT" -type f \
                \( -name build.gradle -o \
                   -name build.gradle.kts -o \
                   -name gradlew \) \
                -not -path '*/.git/*' \
                -not -path '*/node_modules/*' \
                -not -path '*/build/*' \
                -not -path '*/.gradle/*' | sort
            )
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::No Android/Gradle project found."
            echo "The repository or ZIP must contain settings.gradle(.kts), build.gradle(.kts), or gradlew."
            echo "Files found for diagnosis:"
            find "$PROJECT" -maxdepth 4 -type f \
              -not -path '*/.git/*' | head -150 || true
            exit 1
          fi

          ROOT="$(cd "$ROOT" && pwd)"

          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"
          echo "Project files:"
          ls -la "$ROOT" | head -40

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle project
        shell: bash
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -Eeuo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ -f gradlew ]; then
            chmod +x gradlew
          elif command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          else
            echo "::error::Gradle wrapper is missing and Gradle is unavailable."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing."
            exit 1
          fi

      - name: Select Gradle task
        id: task
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_TASK: ${{ inputs.build_task }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
        run: |
          set -Eeuo pipefail

          if [ -n "$BUILD_TASK" ]; then
            TASK="$BUILD_TASK"
          else
            MODE="$(printf '%s' "${BUILD_MODE:-release}" |
              tr '[:upper:]' '[:lower:]')"

            case "$MODE" in
              debug|assembledebug|apk-debug)
                TASK="assembleDebug"
                ;;
              release|assemblerelease|apk|apk-release|"")
                TASK="assembleRelease"
                ;;
              bundle|bundlerelease|aab)
                TASK="bundleRelease"
                ;;
              bundledebug)
                TASK="bundleDebug"
                ;;
              *)
                echo "::error::Unsupported build_mode: $BUILD_MODE"
                exit 1
                ;;
            esac
          fi

          # Insert the flavor into assemble/bundle task names.
          if [ -n "$BUILD_FLAVOR" ]; then
            FLAVOR="$(printf '%s' "$BUILD_FLAVOR" |
              sed 's/^[a-z]/\U&/')"

            case "$TASK" in
              assemble*)
                SUFFIX="${TASK#assemble}"
                TASK="assemble${FLAVOR}${SUFFIX}"
                ;;
              bundle*)
                SUFFIX="${TASK#bundle}"
                TASK="bundle${FLAVOR}${SUFFIX}"
                ;;
              *)
                echo "::error::Cannot automatically apply flavor to task: $TASK"
                exit 1
                ;;
            esac
          fi

          echo "value=$TASK" >> "$GITHUB_OUTPUT"
          echo "Selected Gradle task: $TASK"

      - name: Run native build
        id: build
        shell: bash
        working-directory: ${{ steps.project.outputs.path }}
        env:
          GRADLE_TASK: ${{ steps.task.outputs.value }}
        run: |
          set -Eeuo pipefail

          set +e
          ./gradlew --no-daemon --stacktrace "$GRADLE_TASK" \
            2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          RESULT=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"
          exit "$RESULT"

      - name: Collect APK and AAB files
        id: outputs
        if: always()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.path }}
        run: |
          set -Eeuo pipefail

          OUT="$RUNNER_TEMP/native-artifacts"
          mkdir -p "$OUT"

          if [ -d "$PROJECT_ROOT" ]; then
            find "$PROJECT_ROOT" -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -path '*/build/outputs/*' \
              -not -path '*/.gradle/*' \
              -exec cp --parents '{}' "$OUT/" \; 2>/dev/null || true
          fi

          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            cp "$RUNNER_TEMP/gradle-build.log" "$OUT/gradle-build.log"
          fi

          {
            echo "Native Build Information"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run number: $GITHUB_RUN_NUMBER"
            echo "Project path: ${{ inputs.project_path }}"
            echo "Server: ${{ inputs.server }}"
            echo "Build mode: ${{ inputs.build_mode }}"
            echo "Build task: ${{ steps.task.outputs.value }}"
            echo "Build flavor: ${{ inputs.build_flavor }}"
            echo "Java version: ${{ inputs.java_version }}"
            echo "Telegram user ID: ${{ inputs.user_id }}"
            echo "Telegram username: ${{ inputs.username }}"
            echo "Telegram name: ${{ inputs.user_name }}"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$OUT/build-info.txt"

          echo "Artifact files:"
          find "$OUT" -type f -print

      - name: Upload native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ github.run_number }}
          path: ${{ runner.temp }}/native-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outputs.exit_code }}
          BUILD_TASK: ${{ steps.task.outputs.value }}
        run: |
          {
            echo "## Native Build Summary"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Run: $GITHUB_RUN_NUMBER"
            echo "- Task: ${BUILD_TASK:-not selected}"
            echo "- Exit code: ${BUILD_RESULT:-not available}"
            echo "- Artifact: native-build-$GITHUB_RUN_NUMBER"
            echo "- User ID: ${{ inputs.user_id }}"
            echo "- Username: ${{ inputs.username }}"
          } >> "$GITHUB_STEP_SUMMARY"
