name: Native Build

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target directory (folder tempat zip)'
        required: true
        type: string
      zip_file:
        description: 'Nama file zip project'
        required: false
        default: 'project.zip'
        type: string
      build_task:
        description: 'Gradle task'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease
          - bundleDebug
      build_flavor:
        description: 'Product flavor (kosongkan kalau tidak ada)'
        required: false
        default: ''
        type: string
      java_version:
        description: 'Versi Java'
        required: false
        default: '17'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Target Directory
        id: validate
        env:
          TARGET_INPUT: ${{ inputs.target_dir }}
          ZIP_INPUT: ${{ inputs.zip_file }}
        run: |
          set -e
          echo "::group::Validate"

          TARGET="$TARGET_INPUT"
          ZIP="$ZIP_INPUT"

          if [ -z "$TARGET" ] || [ -z "$ZIP" ]; then
            echo "::error::target_dir dan zip_file wajib valid"
            exit 1
          fi

          case "$TARGET/$ZIP" in
            /*|*../*|*/..)
              echo "::error::Path ZIP tidak valid"
              exit 1
              ;;
          esac

          if [ ! -d "$TARGET" ]; then
            echo "::error::Target directory tidak ditemukan: $TARGET"
            exit 1
          fi

          if [ ! -f "$TARGET/$ZIP" ]; then
            echo "::error::File ZIP tidak ditemukan: $TARGET/$ZIP"
            ls -la "$TARGET" || true
            exit 1
          fi

          ZIP_BYTES=$(stat -c%s "$TARGET/$ZIP")
          ZIP_MB=$((ZIP_BYTES / 1024 / 1024))

          if ! unzip -t "$TARGET/$ZIP" >/dev/null; then
            echo "::error::File ZIP rusak atau tidak valid"
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_size_mb=$ZIP_MB" >> "$GITHUB_OUTPUT"

          echo "ZIP valid: $TARGET/$ZIP ($ZIP_MB MB)"
          df -h
          echo "::endgroup::"

      - name: Extract Project ZIP
        id: extract
        env:
          TARGET: ${{ steps.validate.outputs.target }}
          ZIP: ${{ steps.validate.outputs.zip }}
        run: |
          set -e
          echo "::group::Extract"

          EXTRACT_DIR="$GITHUB_WORKSPACE/$TARGET/project"
          mkdir -p "$EXTRACT_DIR"
          rm -rf "$EXTRACT_DIR"/*
          rm -rf "$EXTRACT_DIR"/.[!.]* "$EXTRACT_DIR"/..?* 2>/dev/null || true

          unzip -o "$GITHUB_WORKSPACE/$TARGET/$ZIP" -d "$EXTRACT_DIR"

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"
          du -sh "$EXTRACT_DIR"
          echo "::endgroup::"

      - name: Detect Gradle Project Root
        id: detect
        env:
          EXTRACT_DIR: ${{ steps.extract.outputs.extract_dir }}
        run: |
          set -e
          ROOT=""

          if [ -f "$EXTRACT_DIR/settings.gradle" ] ||
             [ -f "$EXTRACT_DIR/settings.gradle.kts" ] ||
             [ -f "$EXTRACT_DIR/build.gradle" ] ||
             [ -f "$EXTRACT_DIR/build.gradle.kts" ] ||
             [ -f "$EXTRACT_DIR/gradlew" ]; then
            ROOT="$EXTRACT_DIR"
          else
            FOUND=$(find "$EXTRACT_DIR" -maxdepth 5 -type f \
              \( -name settings.gradle -o \
                 -name settings.gradle.kts -o \
                 -name gradlew \) \
              -not -path '*/node_modules/*' \
              -not -path '*/build/*' | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "::error::Project Gradle tidak ditemukan di ZIP"
              find "$EXTRACT_DIR" -maxdepth 4 -type f | head -n 100
              exit 1
            fi

            ROOT="$(dirname "$FOUND")"
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $ROOT"
          ls -la "$ROOT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/android-cmdline-tools.zip

          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          mv /tmp/android-cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Licenses and Install SDK Packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-33" \
            "build-tools;33.0.1"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -e

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi

          chmod +x gradlew

          if [ ! -f local.properties ]; then
            touch local.properties
          fi

          if grep -q '^sdk.dir=' local.properties; then
            sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_SDK_ROOT|" local.properties
          else
            echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          fi

      - name: Build with Gradle
        id: gradle_build
        working-directory: ${{ steps.detect.outputs.root }}
        env:
          BUILD_TASK: ${{ inputs.build_task }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
        shell: bash
        run: |
          set -o pipefail

          TASK="$BUILD_TASK"
          FLAVOR="$BUILD_FLAVOR"

          if [ -n "$FLAVOR" ]; then
            CAP_FLAVOR="$(printf '%s' "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            TASK="${TASK}${CAP_FLAVOR}"
          fi

          echo "Running: ./gradlew $TASK"

          ./gradlew "$TASK" \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle.log

      - name: Show Gradle Error
        if: failure()
        run: |
          if [ -f /tmp/gradle.log ]; then
            tail -n 150 /tmp/gradle.log
          fi

      - name: Locate APK and AAB
        id: locate
        if: success()
        env:
          ROOT: ${{ steps.detect.outputs.root }}
        run: |
          set -e

          APKS=$(find "$ROOT" -type f -name '*.apk' \
            -not -path '*/.gradle/*' \
            -not -path '*/.git/*' || true)

          AABS=$(find "$ROOT" -type f -name '*.aab' \
            -not -path '*/.gradle/*' \
            -not -path '*/.git/*' || true)

          if [ -z "$APKS" ] && [ -z "$AABS" ]; then
            echo "::error::Build selesai tetapi APK/AAB tidak ditemukan"
            find "$ROOT" -type d -name outputs -print || true
            exit 1
          fi

          {
            echo "apks<<EOF"
            echo "$APKS"
            echo "EOF"
            echo "aabs<<EOF"
            echo "$AABS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "APK:"
          printf '%s\n' "$APKS"
          echo "AAB:"
          printf '%s\n' "$AABS"

      - name: Generate Build Info
        if: always()
        env:
          BUILD_TASK: ${{ inputs.build_task }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
          JAVA_VERSION: ${{ inputs.java_version }}
          TARGET_DIR: ${{ inputs.target_dir }}
          ZIP_FILE: ${{ inputs.zip_file }}
          ZIP_SIZE: ${{ steps.validate.outputs.zip_size_mb }}
          PROJECT_ROOT: ${{ steps.detect.outputs.root }}
        run: |
          {
            echo "=== NATIVE BUILD INFO ==="
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run Number: $GITHUB_RUN_NUMBER"
            echo "Target: $TARGET_DIR"
            echo "ZIP: $ZIP_FILE"
            echo "ZIP Size MB: $ZIP_SIZE"
            echo "Build Task: $BUILD_TASK"
            echo "Build Flavor: $BUILD_FLAVOR"
            echo "Java Version: $JAVA_VERSION"
            echo "Project Root: $PROJECT_ROOT"
            echo "Commit: $GITHUB_SHA"
            echo "Actor: $GITHUB_ACTOR"
            echo "Finished UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > BUILD_INFO.txt

          cat BUILD_INFO.txt

      - name: Upload APK
        if: success() && steps.locate.outputs.apks != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ steps.locate.outputs.apks }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload App Bundle
        if: success() && steps.locate.outputs.aabs != ''
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: ${{ steps.locate.outputs.aabs }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        env:
          BUILD_TASK: ${{ inputs.build_task }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
          JAVA_VERSION: ${{ inputs.java_version }}
          ZIP_SIZE: ${{ steps.validate.outputs.zip_size_mb }}
        run: |
          {
            echo "## Native Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run ID | $GITHUB_RUN_ID |"
            echo "| ZIP Size | ${ZIP_SIZE} MB |"
            echo "| Task | $BUILD_TASK |"
            echo "| Flavor | $BUILD_FLAVOR |"
            echo "| Java | $JAVA_VERSION |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"